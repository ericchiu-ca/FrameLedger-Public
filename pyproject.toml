[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frameledger"
version = "0.1.0"
description = "Benchmark key-frame selection for evidence-grounded financial video notes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.0,<3",
  "PyYAML>=6.0,<7",
  "scenedetect-headless>=0.7.1,<0.8",
]

[project.scripts]
frameledger = "frameledger.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/frameledger"]
