name: Security

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Gitleaks / full history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${archive}" \
            | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks

      - name: Scan complete Git history
        run: >-
          "${RUNNER_TEMP}/gitleaks" git --redact --no-banner
          --log-opts=--all .

  dependency-audit:
    name: pip-audit / locked runtimes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            phase2/mlx_whisper_asr/requirements.lock.txt

      - name: Export frozen main dependencies
        run: >-
          uv export --frozen --no-dev --no-emit-project
          --format requirements.txt
          --output-file "${RUNNER_TEMP}/frameledger-main-requirements.txt"

      - name: Audit main dependencies
        run: >-
          uvx --from pip-audit==2.10.1 pip-audit
          -r "${RUNNER_TEMP}/frameledger-main-requirements.txt"
          --disable-pip --no-deps --progress-spinner off

      - name: Audit isolated ASR dependencies
        run: >-
          uvx --from pip-audit==2.10.1 pip-audit
          -r phase2/mlx_whisper_asr/requirements.lock.txt
          --disable-pip --no-deps --progress-spinner off

      - name: Verify dependency license inventory
        run: python3 scripts/check_license_inventory.py
