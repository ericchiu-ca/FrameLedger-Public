name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / macOS arm64
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install "${{ matrix.python-version }}"

      - name: Verify lockfile
        run: uv lock --check

      - name: Sync main environment
        run: uv sync --frozen --python "${{ matrix.python-version }}"

      - name: Run unit tests
        run: uv run --frozen python -m unittest discover -s tests -v

      - name: Verify CLI import and help
        run: uv run --frozen frameledger --help

      - name: Verify dependency license inventory
        run: uv run --frozen python scripts/check_license_inventory.py

      - name: Verify documentation links
        run: uv run --frozen python scripts/check_docs.py

      - name: Verify public snapshot allowlist
        run: uv run --frozen python scripts/check_public_snapshot.py

      - name: Build wheel and source distribution
        if: matrix.python-version == '3.12'
        run: uv build --out-dir "${RUNNER_TEMP}/frameledger-dist"

      - name: Verify built wheel in an isolated environment
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          wheel_path="${RUNNER_TEMP}/frameledger-dist/frameledger-0.1.0-py3-none-any.whl"
          test -f "${wheel_path}"
          uv run --isolated --no-project --with "${wheel_path}" \
            python -c 'import frameledger; assert frameledger.__version__ == "0.1.0"'
          uv run --isolated --no-project --with "${wheel_path}" frameledger --help
